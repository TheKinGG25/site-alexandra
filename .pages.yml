# Configurația interfeței de editare Pages CMS (https://app.pagescms.org).
# De aici se adaugă articole și se schimbă prețuri sau texte, fără cod.

media:
  input: src/assets/imagini/articole
  output: /assets/imagini/articole

content:
  - name: articole
    label: Articole
    type: collection
    path: src/articole
    filename: "{primary}.md"
    exclude: [articole.json]
    view:
      fields: [title, categorie, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titlu
        type: string
        required: true
      - name: description
        label: Rezumat (1-2 fraze, apare în listă și pe Google)
        type: text
        required: true
      - name: date
        label: Data publicării
        type: date
        required: true
      - name: categorie
        label: Categorie
        type: select
        required: true
        options:
          values: ["Emoții", "Pierderi și schimbări", "Relații", "Adolescenți și părinți"]
      - name: imagine
        label: Imagine (opțional)
        type: image
      - name: body
        label: Textul articolului
        type: rich-text

  - name: tarife
    label: Tarife și reguli
    type: file
    path: src/_data/tarife.json
    format: json
    fields:
      - name: discutieGratuita
        label: Discuția inițială
        type: object
        fields:
          - { name: titlu, label: Denumire, type: string }
          - { name: detalii, label: Detalii, type: string }
          - { name: pret, label: Preț (text), type: string }
      - name: sedinte
        label: Ședințe și pachete
        type: object
        list: true
        fields:
          - { name: titlu, label: Denumire, type: string }
          - { name: detalii, label: Detalii, type: string }
          - { name: pret, label: Preț în lei (doar cifre), type: number }
      - name: cupluFamilie
        label: Cuplu și familie
        type: object
        fields:
          - { name: titlu, label: Denumire, type: string }
          - { name: detalii, label: Detalii, type: string }
          - { name: pret, label: Preț (text), type: string }
      - name: reguli
        label: Reguli de plată și anulare
        type: text
        list: true

  - name: site
    label: Date de contact și setări
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: url, label: Adresa site-ului, type: string }
      - { name: nume, label: Nume, type: string }
      - { name: titlu, label: Titlu profesional complet, type: string }
      - { name: titluScurt, label: Titlu profesional scurt, type: string }
      - { name: codRup, label: Cod RUP, type: string }
      - { name: atestat, label: Atestat, type: string }
      - { name: operator, label: Denumirea cabinetului, type: string }
      - { name: cui, label: CUI, type: string }
      - { name: telefon, label: Telefon (cum se afișează), type: string }
      - { name: telefonLink, label: Telefon pentru apel (+40...), type: string }
      - { name: whatsapp, label: Număr WhatsApp (40..., fără +), type: string }
      - { name: email, label: E-mail, type: string }
      - { name: adresa, label: Adresa cabinetului, type: string }
      - { name: adresaReper, label: Reper, type: string }
      - { name: strada, label: Strada și numărul, type: string }
      - { name: oras, label: Oraș, type: string }
      - { name: codPostal, label: Cod poștal, type: string }
      - { name: linkHarta, label: Link Google Maps, type: string }
      - { name: program, label: Program, type: string }
      - { name: linkedin, label: Link LinkedIn, type: string }
      - { name: googleAnalyticsId, label: Cod Google Analytics (G-...), type: string }
      - { name: butonProgramare, label: Textul butonului principal, type: string }
      - { name: mesajWhatsapp, label: Mesaj precompletat pe WhatsApp, type: string }

  - name: acasa
    label: Pagina Acasă
    type: file
    path: src/_data/acasa.json
    format: json
    fields:
      - { name: eticheta, label: Eticheta de deasupra titlului, type: string }
      - { name: titlu, label: Titlul mare, type: string }
      - { name: subtitlu, label: Introducerea, type: text }
      - { name: prezentare, label: Prezentarea profesională, type: text }
      - { name: butonSecundar, label: Textul butonului secundar, type: string }
      - name: repere
        label: Repere
        type: object
        list: true
        fields:
          - { name: titlu, label: Titlu, type: string }
          - { name: text, label: Text, type: string }
      - name: regasesti
        label: Poate te regăsești aici
        type: object
        fields:
          - { name: titlu, label: Titlu, type: string }
          - { name: intro, label: Introducere, type: text }
          - name: acum
            label: Ce trăiești acum
            type: object
            fields:
              - { name: titlu, label: Titlu, type: string }
              - { name: puncte, label: Puncte, type: text, list: true }
          - name: terapia
            label: Ce putem explora împreună
            type: object
            fields:
              - { name: titlu, label: Titlu, type: string }
              - { name: puncte, label: Puncte, type: text, list: true }
      - name: respira
        label: Respiră cu mine
        type: object
        fields:
          - { name: eticheta, label: Etichetă, type: string }
          - { name: titlu, label: Titlu, type: string }
          - { name: text, label: Text, type: text }
          - { name: nota, label: Notă de siguranță, type: text }
          - { name: final, label: Mesajul de la final, type: string }
      - name: servicii
        label: Secțiunea Servicii
        type: object
        fields:
          - { name: titlu, label: Titlu, type: string }
          - { name: intro, label: Introducere, type: text }
          - name: carduri
            label: Servicii
            type: object
            list: true
            fields:
              - { name: titlu, label: Titlu, type: string }
              - { name: text, label: Text, type: text }
              - name: icoana
                label: Pictogramă
                type: select
                options:
                  values: [persoana, cuplu, familie, frunza]
          - { name: link, label: Textul linkului, type: string }
      - name: cabinetOnline
        label: În cabinet sau online
        type: object
        fields:
          - { name: titlu, label: Titlu, type: string }
          - { name: paragrafe, label: Paragrafe, type: text, list: true }
      - name: articole
        label: Secțiunea Articole
        type: object
        fields:
          - { name: titlu, label: Titlu, type: string }
          - { name: intro, label: Introducere, type: text }
      - name: final
        label: Invitația de la final (apare pe mai multe pagini)
        type: object
        fields:
          - { name: eticheta, label: Etichetă, type: string }
          - { name: titlu, label: Titlu, type: string }
          - name: pasi
            label: Pași
            type: object
            list: true
            fields:
              - { name: titlu, label: Titlu, type: string }
              - { name: text, label: Text, type: text }

  - name: despre
    label: Despre mine (text)
    type: file
    path: src/despre-mine.md
    fields:
      - { name: layout, label: Șablon (nu modifica), type: string, hidden: true }
      - { name: title, label: Titlul paginii, type: string }
      - { name: description, label: Descriere pentru Google, type: text }
      - { name: permalink, label: Adresă (nu modifica), type: string, hidden: true }
      - { name: salut, label: Titlul mare, type: string }
      - { name: body, label: Text, type: rich-text }

  - name: formare
    label: Despre mine (formare și valori)
    type: file
    path: src/_data/formare.json
    format: json
    fields:
      - { name: motto, label: Motto (apare mare pe pagină), type: string }
      - name: valori
        label: Valori
        type: object
        list: true
        fields:
          - { name: titlu, label: Valoare, type: string }
          - { name: text, label: Ce înseamnă pentru mine, type: text }
      - name: lista
        label: Formare
        type: object
        list: true
        fields:
          - { name: titlu, label: Titlu, type: string }
          - { name: detalii, label: Detalii, type: text }

  - name: servicii
    label: Servicii și teme
    type: file
    path: src/_data/servicii.json
    format: json
    fields:
      - name: lista
        label: Servicii
        type: object
        list: true
        fields:
          - { name: titlu, label: Titlu, type: string }
          - { name: scurt, label: Descriere scurtă, type: text }
          - { name: text, label: Descriere completă, type: text }
      - name: teme
        label: Teme
        type: object
        list: true
        fields:
          - { name: grupa, label: Grupa, type: string }
          - { name: teme, label: Teme, type: string, list: true }

  - name: urgente
    label: Linii de urgență (pagina Contact)
    type: file
    path: src/_data/urgente.json
    format: json
    fields:
      - { name: titlu, label: Titlu, type: string }
      - { name: text, label: Text, type: text }
      - { name: intro, label: Introducere, type: text }
      - name: linii
        label: Linii
        type: object
        list: true
        fields:
          - { name: nume, label: Denumire, type: string }
          - { name: numar, label: Număr (cum se afișează), type: string }
          - { name: link, label: Număr pentru apel (fără spații), type: string }
          - { name: detalii, label: Program și detalii, type: string }

  - name: intrebari
    label: Întrebări frecvente
    type: file
    path: src/_data/intrebari.json
    format: json
    list: true
    fields:
      - { name: intrebare, label: Întrebare, type: string }
      - { name: raspuns, label: Răspuns, type: text }
